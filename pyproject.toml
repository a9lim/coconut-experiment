[project]
name = "coconut-experiment"
version = "0.1.0"
description = "Matched Coconut-vs-CoT study of reward-hacking acquisition and monitorability."
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-SA-4.0"
license-files = ["LICENSE"]
authors = [{ name = "a9lim", email = "mx@a9l.im" }]
dependencies = [
    "numpy",
    "scikit-learn",
    "torch>=2.2",
    "tqdm",
    "transformers>=4.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coconut_experiment"]
